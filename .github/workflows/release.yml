name: Release

# Push a tag like v0.2.0 to build the self-contained apps and publish them as a GitHub release.
# "Run workflow" (manual) builds the same files as workflow artifacts only, without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            label: AppleSilicon
          - rid: osx-x64
            label: Intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package OverDesk.app
        run: scripts/package-macos.sh ${{ matrix.rid }}
      - name: Disk image
        run: |
          VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" dist/release
          cp -R dist/OverDesk.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "OverDesk" -srcfolder "$STAGE" -ov -format UDZO \
            "dist/release/OverDesk-$VERSION-macOS-${{ matrix.label }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: dist/release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package OverDesk (x64 + ARM64)
        run: |
          .\scripts\package-windows.ps1 -Rid win-x64
          .\scripts\package-windows.ps1 -Rid win-arm64
      - name: Installer
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$version" installer\overdesk.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          New-Item -ItemType Directory -Force dist\release | Out-Null
          Move-Item "dist\OverDesk-Setup-$version.exe" "dist\release\OverDesk-$version-Windows-Setup.exe"
          Compress-Archive -Path "dist\OverDesk-win-x64\*" -DestinationPath "dist\release\OverDesk-$version-Windows-x64-portable.zip"
          Compress-Archive -Path "dist\OverDesk-win-arm64\*" -DestinationPath "dist\release\OverDesk-$version-Windows-ARM64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: OverDesk ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: release/*
